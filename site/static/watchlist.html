<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>관심 목록 — BetaGo83</title>
<meta name="description" content="브라우저에 저장한 관심 기업과 지도·위키 연결을 다시 확인합니다.">
<script src="./site-shell.js?v=20261020-ia1" defer></script>
<script src="./watchlist.js?v=20261020-ia1" defer></script>
<style>
:root { color-scheme:light; --bg:#faf8f8; --panel:#fff; --text:#2b2b2b; --muted:#5f5f5f; --line:#dedede; --link:#284b63; --soft:#edf3f1; }
@media(prefers-color-scheme:dark) { :root:not([data-theme="light"]) { color-scheme:dark; --bg:#161618; --panel:#1f1f22; --text:#ebebec; --muted:#b4b4ba; --line:#464348; --link:#a3c2d7; --soft:#273a35; } }
:root[data-theme="dark"] { color-scheme:dark; --bg:#161618; --panel:#1f1f22; --text:#ebebec; --muted:#b4b4ba; --line:#464348; --link:#a3c2d7; --soft:#273a35; }
* { box-sizing:border-box; } [hidden] { display:none!important; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.65 "Noto Sans KR",system-ui,-apple-system,sans-serif; word-break:keep-all; overflow-wrap:anywhere; }
a { color:var(--link); text-underline-offset:3px; } button { font:inherit; min-height:44px; padding:8px 11px; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:7px; cursor:pointer; }
:focus-visible { outline:3px solid var(--link); outline-offset:3px; }
.wrap { width:min(100% - 36px,900px); margin:auto; } header { background:var(--panel); border-bottom:1px solid var(--line); } .topbar { display:flex; justify-content:space-between; gap:16px; padding-block:14px; align-items:center; } .brand { font-weight:700; text-decoration:none; }
nav { display:flex; gap:8px 18px; flex-wrap:wrap; font-size:.9rem; } main { padding-block:24px 40px; } h1 { margin:0; font-size:clamp(1.8rem,4vw,2.35rem); letter-spacing:-.04em; } .intro,.small { color:var(--muted); } .small { font-size:.85rem; }
.snapshot { padding:14px 16px; border:1px solid var(--line); border-radius:10px; background:var(--panel); } .snapshot p { margin:3px 0; } .notice { padding:16px; background:var(--soft); border-radius:8px; }
.watch-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); } .watch-row:last-child { border-bottom:0; } .watch-name { font-weight:650; } .watch-meta { color:var(--muted); font-size:.85rem; } .watch-links { display:flex; gap:10px; flex-wrap:wrap; } footer { border-top:1px solid var(--line); padding:18px 0; color:var(--muted); font-size:.82rem; }
@media(max-width:650px) { .wrap { width:calc(100% - 28px); } .topbar { align-items:flex-start; } .watch-row { display:block; } .watch-links { margin-top:8px; } }
</style>
</head>
<body>
<header><div class="wrap topbar"><a class="brand" href="../" target="_top">BetaGo83</a><nav aria-label="사이트 탐색"><a href="./companies.html" target="_top">기업·테마</a></nav></div></header>
<main class="wrap">
  <h1>관심 목록</h1>
  <p class="intro">이 브라우저에 저장한 기업을 다시 보고, 지난 방문 뒤 뉴스·공시가 달라졌는지 확인하는 자리입니다.</p>
  <section class="snapshot" aria-label="관심 목록 보관 방식"><p><strong id="count">0개</strong> 저장됨</p><p class="small">목록은 이 브라우저에만 저장됩니다. 계정 동기화나 서버 전송은 하지 않습니다.</p><button id="clear" type="button">관심 목록 비우기</button></section>
  <section aria-labelledby="list-title"><h2 id="list-title">저장한 기업</h2><div id="items"></div><p id="empty" class="notice" hidden>저장한 기업이 없습니다. <a href="./companies.html">기업·테마</a>에서 회사 옆 ☆ 버튼으로 추가하세요.</p></section>
</main>
<footer><div class="wrap"><p>관심 목록은 개인 브라우저 상태이며 공개 데이터나 투자 추천 목록이 아닙니다.</p><p>AI가 뉴스와 공시를 바탕으로 정리한 참고 자료입니다. 틀린 내용이 있을 수 있으니 원문을 확인하세요. 투자 권유가 아닙니다.</p></div></footer>
<script>
window.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function add(tag, text, parent, className) { var node = document.createElement(tag); if (text !== undefined) node.textContent = text; if (className) node.className = className; if (parent) parent.appendChild(node); return node; }
  function link(parent, label, href) { var node = add("a", label, parent); node.href = href; node.target = "_top"; return node; }
  function render() {
    var rows = window.BetaGoWatchlist ? window.BetaGoWatchlist.list() : [];
    $("count").textContent = rows.length.toLocaleString("ko-KR") + "개"; $("items").replaceChildren(); $("empty").hidden = !!rows.length; $("clear").disabled = !rows.length;
    rows.forEach(function (row) {
      var box = add("article", null, $("items"), "watch-row"), info = add("div", null, box), name = add("div", row.name, info, "watch-name");
      name.appendChild(document.createTextNode(" · " + row.ticker)); add("div", row.market === "KOSPI" ? "코스피" : "코스닥", info, "watch-meta");
      var links = add("div", null, box, "watch-links");
      if (row.wiki_path) link(links, "기업 위키", "../" + row.wiki_path.split("/").map(encodeURIComponent).join("/"));
      link(links, "기업 지도", "./map.html?node=" + encodeURIComponent(row.name));
      var remove = add("button", "관심에서 빼기", links); remove.type = "button"; remove.addEventListener("click", function () { window.BetaGoWatchlist.remove(row.id); render(); });
    });
  }
  $("clear").addEventListener("click", function () { if (window.BetaGoWatchlist) window.BetaGoWatchlist.clear(); render(); }); render();
});
</script>
</body>
</html>
